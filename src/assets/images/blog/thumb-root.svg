<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#EAEBD7"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(26,26,26,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#grid)"/>
  <!-- Concentric graph nodes -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="200" cy="200" r="70" fill="none" stroke="#8EA8B5" stroke-width="3"/>
  <line x1="200" y1="70" x2="200" y2="330" stroke="#1A1A1A" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="70" y1="200" x2="330" y2="200" stroke="#1A1A1A" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Central Hub -->
  <circle cx="200" cy="200" r="45" fill="#D8D9C5" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Orbiting satellites -->
  <circle cx="200" cy="70" r="18" fill="#8CA68E" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="292" cy="147" r="14" fill="#8EA8B5" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="292" cy="253" r="20" fill="#1A1A1A" stroke="#EAEBD7" stroke-width="2"/>
  <circle cx="200" cy="330" r="16" fill="#8CA68E" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="108" cy="253" r="18" fill="#8EA8B5" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="108" cy="147" r="15" fill="#1A1A1A" stroke="#EAEBD7" stroke-width="2"/>
  <!-- Center symbol -->
  <text x="200" y="206" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#1A1A1A" text-anchor="middle">ROOT</text>
  <rect x="15" y="15" width="370" height="370" fill="none" stroke="#1A1A1A" stroke-width="2"/>
</svg>
