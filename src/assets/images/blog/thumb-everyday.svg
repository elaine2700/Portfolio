  <line x1="275" y1="200" x2="275" y2="260" stroke="#8EA8B5" stroke-width="3"/>
  <text x="200" y="345" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="middle">AFFORDANCE // UX</text>
